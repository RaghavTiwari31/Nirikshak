name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: satsa
          POSTGRES_PASSWORD: satsa_dev
          POSTGRES_DB: satsa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U satsa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://satsa:satsa_dev@localhost:5432/satsa_test
      TEST_DATABASE_URL: postgresql+psycopg://satsa:satsa_dev@localhost:5432/satsa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Migrations apply cleanly and match models
        run: |
          alembic upgrade head
          alembic check
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  offline-images:
    # The air-gapped bundle must always build: both images plus a valid offline compose file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline compose file is valid
        run: docker compose -f docker-compose.offline.yml --env-file .env.offline.example config -q
      - run: docker build -t satsa/api:ci backend
      - run: docker build -t satsa/web:ci frontend
