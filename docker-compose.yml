# Local development database for SAT-SA.
#   docker compose up -d db            -> Postgres 16 on localhost:5432
#   docker compose --profile tools up  -> also starts Adminer on localhost:8080
services:
  db:
    image: postgres:16-alpine
    container_name: satsa-db
    environment:
      POSTGRES_USER: satsa
      POSTGRES_PASSWORD: satsa_dev
      POSTGRES_DB: satsa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satsa -d satsa"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: satsa-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pgdata:
